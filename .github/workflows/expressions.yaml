name: using expressions
run-name: using-expressions | DEBUG - ${{inputs.debug && 'ON' || 'OFF'}}

on:
    workflow_dispatch:
        inputs:
            debug:
                type: boolean
                default: false
jobs:
    echo:
        runs-on: ubuntu-latest
        steps:
            - name: '[Debug] print start-up data'
              if: inputs.debug
              run: |
                echo "Debug mode is ON"
                echo "workflow name: ${{ github.workflow }}"
                echo "workflow run id: ${{ github.run_id }}"
                echo "workflow run number: ${{ github.run_number }}"
                echo "Event name: ${{ github.event_name }}"
                echo "Actor: ${{ github.actor }}"
                echo "Repository: ${{ github.repository }}"
                echo "Branch: ${{ github.ref_name }}"
                echo "SHA: ${{ github.sha }}"
            - name: '[Debug] print when triggered from main'
              if: inputs.debug && github.ref_name == 'main'
              run: |
               echo "This workflow was triggered from the main branch"

            - name: greeting
              run: |
                echo "Hello, ${{github.actor}}! welcome to the using expressions workflow"